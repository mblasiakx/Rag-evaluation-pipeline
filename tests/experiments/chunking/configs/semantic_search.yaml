experiment_name: 'semantic_search'

chunker: 'semantic'

params:
  threshold: 0.55
  max_chunk_size: 256

query: 'History and geography of Lyon, France' # <-- nowe

metrics:
  - coherence
  - topic_drift
  - chunk_entropy
  - chunk_size_std
  - chunk_size_mean
  - boundary_quality
  - inter_chunk_similarity

input_file: 'data/Lyon.txt'
output_dir: 'tests/experiments/chunking/results/outputs/'
output_chunks_path: 'tests/experiments/data/semantic/chunk_{max_chunk_size}_threshold{threshold}.jsonl'
