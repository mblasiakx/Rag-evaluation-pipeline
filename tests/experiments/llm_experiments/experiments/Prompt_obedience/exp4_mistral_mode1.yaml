experiment_name: 'Prompt Sensitivity × Instruction Following'
description: 'Experiment with Mistral model and no context.'

model:
  provider: local
  name: 'mistral:7b'
  temperature: 0.0
  max_tokens: 512

dataset:
  path: 'llm_experiments/datasets/Prompt_obedience_questions/exp1_gemma_mode1.json'
  question_field: 'query'
  answer_field: 'answer'

prompts:
  path: 'prompts_experiments/prompts/experiments'
  variants: 1
  types:
    - chain-of-thought
    - few_shot
    - instruction_based
    - one_shot
    - role_based
    - self_ask
    - structured_output
    - zero_shot

mode: 1

metrics:
  - instruction_compliance_rate
  - semantic_dispersion
  - instruction_features_compliance

results:
  output_dir: 'llm_experiments/experiments/Prompt_obedience/results/llm_experiments/exp4_prompt_obedience_mode1_mistral/'
  save_json: true
  save_csv: true
