name: config_B
description: 'semantic chunking (256/0.55), mean pooling, zero_shot'

data:
  files:
    - 'data/Champions League.txt'
  questions: 'data/questions/champions_league_qa.jsonl'

chunking:
  type: semantic
  max_chunk_size: 256
  similarity_threshold: 0.55

embedding:
  model: 'sentence-transformers/all-MiniLM-L6-v2'
  pooling: mean
  normalize: true

retrieval:
  k: 2

generator:
  model: 'gemma3:1b'
  temperature: 0.0

prompt:
  style: zero_shot
